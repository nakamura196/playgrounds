{%- assign fields = site.data.config-search -%}
{%- assign index_fields = fields | where: 'index','true' -%}
{%- assign t = site.data.locale[site.lang] -%}
<script src="{{ site.lib-assets | default: '/assets/lib' | relative_url }}/lunr.min.js"></script>
<script src="{{ '/assets/js/lunr-store.js' | relative_url }}"></script>
{%- if site.data.theme.search-cjk == true %}
<script src="{{ '/assets/cjk-index/cjk-index.js' | relative_url }}"></script>
{%- endif %}
<script>

/* search engine: "cjk" (index prebuilt at build time by the cjk_index gem,
   assets/cjk-index/search.json) or "lunr" (lunr defaults).
   ?engine=lunr forces the original behaviour, for comparison. */
var searchEngine = {% if site.data.theme.search-cjk == true %}"cjk"{% else %}"lunr"{% endif %};
if (new URLSearchParams(window.location.search).get('engine') === 'lunr') { searchEngine = "lunr"; }

/* initialize lunr */
/* cjk_index returns the store "id" of each hit; map it back to the store position */
var storePosition = {};
store.forEach(function (s, i) { storePosition[s.id] = i; });
var cjkReady = searchEngine === "cjk" ? CJKIndex.load({{ '/assets/cjk-index/search.json' | relative_url | jsonify }}) : null;
var idx = searchEngine === "cjk" ? null : lunr(function () {
    /* uncomment the line below to turn off the default Lunr stopword list */
    //this.pipeline.remove(lunr.stopWordFilter)
    /* add index fields from config */
    this.ref('id')
    {% for f in index_fields %}
    this.field({{ f.field | jsonify }})
    {% endfor %}
    for (var item in store) {
        this.add({
            {% for f in index_fields %}
            {{ f.field | jsonify }}: store[item][{{ f.field | jsonify }}],
            {% endfor %}
            id: item
        })
    }
});

/* search function */
function lunr_search () {
    if (cjkReady) { cjkReady.then(function (cjkIdx) { show_results(cjkIdx.search(searchbox.value).map(function (r) { return { ref: storePosition[r.ref] }; })); }); }
    /* basic search that supports operators */
    else { show_results(idx.search(searchbox.value)); }
}

/* mark the matched part of each shown field (cjk engine only) */
function hl (value) {
    return searchEngine === "cjk" ? CJKIndex.highlight(value, searchbox.value) : value;
}

function show_results (results) {
    resultsdiv.innerHTML = "";
    var newresults = "";
    for (var item in results) {
        var ref = results[item].ref;
        var searchitem =
            '<li class="border-bottom mb-3 search-result">'+
            (store[ref].image_thumb ? '<a class="search-thumb" href="{{ "/items/" | relative_url }}' + store[ref].id + '" tabindex="-1" aria-hidden="true"><img class="lazyload" data-src="' + store[ref].image_thumb + '" alt=""></a>' : '') +
            '<div class="search-text">' +
            {% assign display = fields | where: 'display','true' %}{% for d in display %}{% if forloop.first %}
            '<h4><a href="{{ "/items/" | relative_url }}' + store[ref].id + '">' + hl(store[ref][{{ fields[0].field | jsonify }}])  + '</a></h4>' +
            '<p class="ms-3">';{% else %}
            if(store[ref][{{ d.field | jsonify }}]) { searchitem += hl(store[ref][{{ d.field | jsonify }}]) + '<br> '; }{% endif %}{% endfor %}
        searchitem += '</p></div></li>';
        newresults += searchitem;
    }
    var resultslist = `<h3 class="border-bottom mb-3 h5"><small>${ {{ t.results_found | default: '%n Results found' | jsonify }}.replace('%n', results.length) }</small></h3>
                        <ul class="list-unstyled">${newresults}</ul>`;
    resultsdiv.innerHTML = resultslist;
}

/* set elements */
var resultsdiv = document.getElementById('searchResults');
var searchbox = document.getElementById('searchBox');

/* init search box and get query string */
document.addEventListener('DOMContentLoaded', function(event) {
    var queryString = new URLSearchParams(window.location.search).get('q');
    if (queryString) {
        searchbox.value = queryString;
        lunr_search();
    }
});

</script>
