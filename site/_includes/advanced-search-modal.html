{%- assign t = site.data.locale[site.lang] -%}
<button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
  {% if t.advanced_search_title %}{{ t.advanced_search_title }}{% else %}{{ t.advanced_short | default: "Advanced" }}<span class="d-none d-md-inline">{{ t.advanced_short_suffix | default: " Search" }}</span>{% endif %}
</button>
<div class="modal fade" id="advancedSearchModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title h4" id="advancedSearchModalLabel">{{ t.advanced_search_title | default: "Advanced Search" }}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ t.close | default: "Close" }}"></button>
      </div>
      <div class="modal-body">
        <form id="advancedSearchForm">
          <div id="searchRows">
            <!-- Initial search rows will be inserted here -->
          </div>
          <div class="mt-3">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addSearchRow()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
              </svg>
              {% if t.add_another_field %}{{ t.add_another_field }}{% else %}Add Another Field{% endif %}
            </button>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ t.close | default: "Close" }}</button>
        <button type="button" class="btn btn-primary" onclick="submitAdvancedSearch()">{{ t.search | default: "Search" }}</button>
      </div>
    </div>
  </div>
</div>

<!-- Template for search row -->
<template id="searchRowTemplate">
    <div class="search-row mb-4">
        <div class="row align-items-center">
            <div class="col-4 col-md-2">
                <select class="form-select form-select-sm boolean-operator" aria-label="{{ t.boolean_option | default: "Boolean option" }}">
                    <option value="AND">{{ t.op_and | default: "AND" }}</option>
                    <option value="OR">{{ t.op_or | default: "OR" }}</option>
                    <option value="NOT">{{ t.op_not | default: "NOT" }}</option>
                </select>
            </div>
            <div class="col-5 col-md-3">
                <select class="form-select form-select-sm field-select" aria-label="{{ t.metadata_field | default: "Metadata Field" }}">
                    <option value="all">{{ t.all_fields | default: "All Fields" }}</option>
                    <option value="title">{{ t.title | default: "Title" }}</option>
                    {% for f in site.data.config-browse %}{% assign cap-field = f.field | capitalize %}
                    <option value="{{ f.field }}">{{ f.facet_name | default: f.display_name | default: cap-field }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-10 col-md-6">
                <input type="text" class="form-control form-control-sm search-input" aria-label="{{ t.search_terms | default: "Search term" }}" placeholder="{{ t.enter_search_term | default: "Enter search term" }}">
                <div class="date-range-inputs">
                    <div class="date-input-group">
                        <input type="text" class="form-control form-control-sm start-date" aria-label="{{ t.start_date | default: "Start Date" }}" placeholder="{{ t.start_date | default: "Start Date" }}">
                        <span class="date-separator">{{ t.to | default: "to" }}</span>
                        <input type="text" class="form-control form-control-sm end-date" aria-label="{{ t.end_date | default: "End Date" }}" placeholder="{{ t.end_date | default: "End Date" }}">
                    </div>
                </div>
            </div>
            <div class="col-2 col-md-1">
                <button type="button" class="btn btn-outline-danger btn-sm remove-row" aria-label="{{ t.remove_condition | default: "Remove condition" }}"><span aria-hidden="true">&times;</span></button>
            </div>
        </div>
    </div>
</template>
