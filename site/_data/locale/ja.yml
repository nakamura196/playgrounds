search_help_intro: "検索語の後ろに次の書き方を足すと、結果を絞り込めます。"
search_op_field: "項目を指定する：項目名、コロン、検索語の順に書きます。例：<code>title:foo</code>、<code>date:1911</code>、<code>subject:tree</code>。この目録で使える項目は "
search_op_field_end: "。"
search_op_wildcard: "ワイルドカード：<code>*</code> は任意の文字列を表します。例：<code>foo*</code>、<code>*oo</code>。語の前半や後半だけで探すときに便利です。"
search_op_fuzzy: "あいまい検索：検索語の後ろに <code>~</code> と数字を付けます。例：<code>foo~1</code>。数字が大きいほど、ゆれを許します。表記ゆれの吸収に使えます。"
search_op_boost: "重み付け：語の後ろに <code>^</code> と数字を付けると、その語を重視します。例：<code>foo^10</code>。複数の語のうち、特に大事な語があるときに使います。"
